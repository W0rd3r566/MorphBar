name: Publish MorphBar v0.6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.6.1.yml'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish prerelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify tests and assemble APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish GitHub prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/MorphBar-v0.6.1-debug.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## MorphBar v0.6.1 — Pixel 9a / Android 17 beta

          This is a **test prerelease**. On-device touch behavior is not yet confirmed, so please report bugs.

          - Camera-aligned compact island and Material 3 Expressive animations.
          - Wavy music progress with press-and-drag seeking.
          - Album art handling from media metadata, local artwork URIs and MediaStyle notifications.
          - A small, visible **open control below the protected Android status bar**.
          - Tap the control to expand media or open a notification; long-press for notification details.
          - Expanded player has a close button and a swipe-up handle.
          - Avoids automatically duplicating high-importance Android heads-up banners.

          The APK has the **debug application ID** `dev.w0rd3r.morphbar.debug`.
          It is not a production-signed Play Store build.
          The app was adapted from Islet (Apache-2.0), original author Dylan Neve.

          Source: https://github.com/W0rd3r566/MorphBar
          NOTES
          gh release create v0.6.1 "$RUNNER_TEMP/MorphBar-v0.6.1-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "MorphBar v0.6.1 (Beta)" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
